[project]
name = "qwen3-tts-vc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.17.3",
    "pyloudnorm>=0.1.1",
    "qwen-tts>=0.1.1",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
]

[project.scripts]
qwen3-tts-playground = "playground.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tts_core", "playground"]
